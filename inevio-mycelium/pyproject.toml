[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inevio-mycelium"
version = "1.0.0"
description = "Living mycelium for Inevio: search, attach, penetrate deeper"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Inevio"}]
license = {text = "MIT"}
dependencies = [
    "spore-net>=1.2.0",
    "spore-bridge>=1.0.0",
]